name: Secure delivery read-only governance probe
on:
  push:
    branches: [feature/authenticated-delivery-worker]
    paths:
      - '.github/workflows/secure-delivery-governance-probe.yml'
      - 'secure-delivery/scripts/probe-governance.mjs'
      - 'secure-delivery/scripts/github-governance.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read real Environment and branch protection APIs, without deploying
        run: node secure-delivery/scripts/probe-governance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
