name: Secure delivery checks
on:
  push:
    branches: [main, feature/authenticated-delivery-worker]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: secure-delivery-verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: secure-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: secure-delivery/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/check-workflows.py
      - run: npm ci
      - run: npm run check && npm test && npm run test:governance && npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
