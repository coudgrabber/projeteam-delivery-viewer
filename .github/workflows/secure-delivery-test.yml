name: Secure delivery checks
on:
  push:
    branches: [feature/authenticated-delivery-worker]
    paths: ['secure-delivery/**', '.github/workflows/secure-delivery-*.yml']
  pull_request:
    paths: ['secure-delivery/**', '.github/workflows/secure-delivery-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: secure-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: secure-delivery/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
